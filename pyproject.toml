[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpt-sovits-webui"
version = "0.1.0"
description = "GPT-SoVITS WebUI with uv-based dependency management"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy<2.0",
  "scipy",
  "tensorboard",
  "librosa==0.10.2",
  "numba",
  "pytorch-lightning>=2.4",
  "gradio<5",
  "ffmpeg-python",
  "onnxruntime; platform_machine == \"aarch64\" or platform_machine == \"arm64\"",
  "onnxruntime-gpu; platform_machine == \"x86_64\" or platform_machine == \"AMD64\"",
  "tqdm",
  "funasr>=1.3.1",
  "cn2an",
  "pypinyin",
  "pyopenjtalk>=0.4.1; sys_platform != \"win32\"",
  "g2p_en",
  "soundfile",
  "modelscope",
  "sentencepiece",
  "transformers>=4.43,<=4.50",
  "peft<0.18.0",
  "chardet",
  "PyYAML",
  "psutil",
  "jieba",
  "split-lang",
  "fast_langdetect>=0.3.1",
  "wordsegment",
  "rotary_embedding_torch",
  "ToJyutping",
  "g2pk2",
  "ko_pron",
  "opencc",
  "python_mecab_ko; sys_platform != \"win32\"",
  "fastapi[standard]>=0.115.2",
  "x_transformers",
  "torchmetrics<=1.5",
  "pydantic<=2.10.6",
  "ctranslate2>=4.0,<5",
  "av>=11",
  "django>=5.2.9",
  "certifi",
  "charset-normalizer",
  "huggingface_hub[hf_xet]",
  "torch",
  "triton; sys_platform != \"win32\"",
  "torchaudio",
  "torchvision",
  "torchcodec",
  "chromadb>=0.5.0",
  "silero-vad>=5.1",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

# 本地 PyTorch wheel 目录。
# 使用前请先确认 down/torch 里放的是 Python 3.10 对应的 cp310 wheel。
# 如果当前 .venv 已经装过旧的 torch / torchaudio / torchvision，
# 先在虚拟环境里执行：
#   uv pip uninstall --python .venv\Scripts\python.exe torch torchaudio torchvision
# 然后再执行：
#   uv lock
#   uv sync --link-mode=copy
[[tool.uv.index]]
name = "pytorch-local"
url = "down/torch"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-local" }
torchaudio = { index = "pytorch-local" }
torchvision = { index = "pytorch-local" }

[tool.hatch.build.targets.wheel]
packages = ["GPT_SoVITS"]
